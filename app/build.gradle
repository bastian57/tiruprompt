plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.daftech.tiruprompt'
    compileSdk 34

    defaultConfig {
        applicationId 'com.daftech.tiruprompt'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary = true }
    }

    signingConfigs {
        tetap {
            storeFile rootProject.file('signing/tiruprompt-tetap.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Personal install: TANPA suffix .debug supaya package tetap com.daftech.tiruprompt
            // Kunci tetap: dipakai kalau file keystore hasil decode secret ada (CI);
            // lokal tanpa file itu jatuh ke debug keystore bawaan.
            if (rootProject.file('signing/tiruprompt-tetap.keystore').exists()) {
                signingConfig signingConfigs.tetap
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose = true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.15' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    def composeBom = '2024.06.00'
    implementation platform("androidx.compose:compose-bom:$composeBom")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.core:core-ktx:1.13.1'

    // HTTP: Gemini REST, YouTube Data API, scrape halaman publik.
    // JSON pakai org.json bawaan Android — tanpa dependensi tambahan.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

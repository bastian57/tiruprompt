name: TiruPrompt Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pasang keystore tetap
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then echo "ERROR: Secret KEYSTORE_B64 belum diset"; exit 1; fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > signing/tiruprompt-tetap.keystore
          test -s signing/tiruprompt-tetap.keystore
          FP=$(keytool -list -v -keystore signing/tiruprompt-tetap.keystore -storepass android -alias androiddebugkey | grep -i "SHA256:" | head -1 | awk '{print $2}')
          echo "Fingerprint: $FP"
          if [ "$FP" != "0A:A5:2A:F9:10:17:42:AE:5D:5A:13:80:F7:F2:E8:A4:F1:F5:88:03:80:6F:B6:09:43:72:D3:3C:78:10:30:20" ]; then echo "ERROR GERBANG KEYSTORE"; exit 1; fi
          echo "GERBANG KEYSTORE LOLOS"
      - name: Set up Android SDK manual
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q -o cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Install Gradle 8.7
        run: |
          set -e
          cd /tmp
          curl -sL -o gradle-8.7-bin.zip "https://services.gradle.org/distributions/gradle-8.7-bin.zip"
          unzip -q -o gradle-8.7-bin.zip
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: |
          set -e
          gradle assembleDebug 2>&1 | tee build.log
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "TiruPrompt-v${V}.apk"
          ls -lh "TiruPrompt-v${V}.apk" build.log
      - name: Gerbang sertifikat APK
        run: |
          set -e
          APKSIGNER=$(ls "$HOME/android-sdk/build-tools/"*/apksigner | head -1)
          CERT=$("$APKSIGNER" verify --print-certs TiruPrompt-v*.apk | grep "SHA-256 digest" | awk '{print $NF}')
          echo "SHA-256 sertifikat APK: $CERT"
          if [ "$CERT" != "0aa52af9101742ae5d5a1380f7f2e8a4f1f58803806fb6094372d33c78103020" ]; then echo "ERROR GERBANG SERTIFIKAT"; exit 1; fi
          echo "GERBANG SERTIFIKAT LOLOS"
      - name: Upload build.log selalu
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then
            gh release view build-log > /dev/null 2>&1 || gh release create build-log --title "build-log" --notes "Build logs - TiruPrompt"
            gh release upload build-log build.log --clobber
          fi
      - name: Upload APK ke latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release view latest > /dev/null 2>&1 || gh release create latest --title "latest" --notes "Rolling latest build - TiruPrompt"
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)
          gh release upload latest "TiruPrompt-v${V}.apk" --clobber
          echo "UPLOAD OK"
